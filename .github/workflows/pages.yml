# Publishes the static mirror (recorded sample, Qloo fixtures, no API keys) to GitHub Pages on every
# push to main, after the tests and type check pass. The live agent runs on Cloudflare Workers; see
# docs/DEPLOY.md.
#
# Data rule: the two generated modules (src/demo/fixtures.generated.ts, src/recorded.generated.ts)
# are build artifacts, not committed, so `npm run prepare:data` rebuilds them here first. A fresh
# checkout has no private/ directory, so the build only ever sees the public placeholder fixtures
# and the placeholder recording; live Qloo captures can never reach this mirror.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:data
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
